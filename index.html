<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lunaria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#fbf7f1;--bg2:#f4ece1;--card:#ffffff;--ink:#3b302a;--mut:#8b7f76;--line:#ece4d8}
html[data-night]{color-scheme:dark;--bg:#2a2433;--bg2:#221d2a;--card:#352e40;--ink:#f6eee4;--mut:#c4b8ad;--line:#4a4155}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(ellipse at 50% 55%,var(--bg) 0,var(--bg) 50%,var(--bg2) 100%) fixed;color:var(--ink);font:15px/1.5 'DM Sans',system-ui,sans-serif;overflow:hidden}
#game{position:fixed;inset:0}
#game canvas{display:block}
</style>
</head>
<body>
<div id="game"></div>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
<script type="module" src="/src/main.js"></script>
</body>
</html>
